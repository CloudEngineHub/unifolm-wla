run_id: debug_mmdit_lora_frozen_vlm
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: unifolm_wla_pretrain
is_debug: false

framework:
  name: QwenMMDiT
  qwenvl:
    base_vlm: /home/jensen/Documents/model/qwen3_vl_4b_full_er_2_with_action/checkpoint-20000
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
  robot_state_projector:
    enabled: true
    input_dim: 120
    projector_hidden_size: null
    load_from: null
  action_model:
    action_model_type: DiT-L
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 54
    state_dim: 0
    action_horizon: 30
    repeated_diffusion_steps: 1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    embodiment_types: ["unitree"]
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      num_attention_heads: 32
      attention_head_dim: 48
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: single_source_datasets
    data_config_path: unifolm_wla/dataloader/multi_source_dataset/configs/unitree_debug.yaml
    per_device_batch_size: 1
    num_workers: 2

trainer:
  # No whole-module freeze_modules here — both backbones are LoRA-adapted,
  # and peft freezes each backbone's base weights automatically on injection.
  lora:
    enabled: true
    qwen_vl_interface:
      enabled: true
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
      bias: "none"
    action_model:
      enabled: true
      r: 16
      lora_alpha: 32
      lora_dropout: 0.05
      target_modules: ["to_q", "to_k", "to_v", "to_out.0", "add_q_proj", "add_k_proj", "add_v_proj", "to_add_out"]
      bias: "none"
  max_train_steps: 20
  num_warmup_steps: 2
  save_interval: 10
  eval_interval: 10000
  logging_frequency: 1
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  is_resume: false
  learning_rate:
    base: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  save_format: safetensors
